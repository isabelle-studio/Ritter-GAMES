
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<meta name="theme-color" content="#24264f">
<meta name="mobile-web-app-capable" content="yes">

<title>Ritter Games</title>

<style>
body {
    margin: 0;
    background: #24264f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
}

#logo {
    width: min(180px, 45vw);
    height: auto;
    display: block;
}
</style>
</head>

<body>

<img id="logo" src="assets/icon-rot.png" alt="Ritter Games">

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
}

const logos = [
    "assets/icon-rot.png",
    "assets/icon-gruen.png",
    "assets/icon-gelb.png",
    "assets/icon-blau.png",
    "assets/icon-pink.png"
];

const logo = document.getElementById("logo");

async function startLoader() {

    // Alle Icons vollständig laden
    await Promise.all(logos.map(src => new Promise(resolve => {
        const img = new Image();
        img.onload = resolve;
        img.onerror = resolve;
        img.src = src;
    })));

    let current = 0;

    // Farbwechsel
    const animation = setInterval(() => {
        current = (current + 1) % logos.length;
        logo.src = logos[current];
    }, 300);

    // Nach 2,5 Sekunden zum Menü
    setTimeout(() => {
        clearInterval(animation);
        window.location.replace("menu.html");
    }, 2500);
}

startLoader();
</script>

</body>
</html>
