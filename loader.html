<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="snake/icon-180.png">
<meta name="theme-color" content="#24264f">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Ritter Games</title>

<style>

body{
    margin:0;
    background:#24264f;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
    min-height:100dvh;

    overflow:hidden;
}

#logo{
    width:min(180px, 45vw);
    height:auto;
    display:block;
}

</style>
</head>

<body>

<img id="logo" src="assets/icon-rot.png">

<script>

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");

const logos = [
    "assets/icon-rot.png",
    "assets/icon-gruen.png",
    "assets/icon-gelb.png",
    "assets/icon-blau.png",
    "assets/icon-pink.png"
];

let current = 0;

logos.forEach(src => { new Image().src = src; });

const logo = document.getElementById("logo");

setInterval(() => {

    current++;

    if(current >= logos.length){
        current = 0;
    }

    logo.src = logos[current];

}, 300);

setTimeout(() => {

  window.location.replace("menu.html");

}, 2500);

</script>

</body>
</html>
