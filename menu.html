<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritter Games</title>

    <link rel="stylesheet" href="https://use.typekit.net/tat5mdv.css">
    <style>
        body {
            margin: 0;
            background: #24254f;

           display:flex;
           justify-content:center;
           align-items:center;

           height:100vh;

    font-family:"futura-pt", sans-serif;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}
        .container{
    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:white;
    font-size:clamp(28px, 6vw, 48px);
    margin-bottom:40px;

    font-family:"futura-pt", sans-serif;
    font-weight:700;
    letter-spacing:2px;
}

       .menu{
    display:flex;
    gap:40px;
}

        .card {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }
        
.card:active{
    transform:scale(0.96);
}

        .card img{
    width:min(36vw, 260px);
    height:min(36vw, 260px);
    display:block;
}
    </style>
</head>

<body>

<div class="container">

    <h1>RITTER GAMES</h1>

    <div class="menu">

    <div class="card" onclick="location.href='snake/'">
        <img src="assets/icon-snake.png" alt="Snake">
    </div>

    <div class="card" onclick="location.href='tetris/'">
        <img src="assets/icon-tetris.png" alt="Tetris">
    </div>

    </div>

</div>

</body>
</html>
