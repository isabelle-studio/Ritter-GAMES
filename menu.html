<!DOCTYPE html>
<html lang="de">

<head>
      <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="snake/icon-180.png">
<meta name="theme-color" content="#24264f">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ritter Games</title>

  
    <style>
        @font-face {
    font-family: "Jost";
    src: url("assets/Jost.ttf") format("truetype");
    font-weight: 100 900;
    font-display: block;
}
        body {
            margin: 0;
            background: #24264f;

           display:flex;
           justify-content:center;
           align-items:center;

         height:100vh;
         height:100dvh;

    font-family:"Jost", sans-serif;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}
        .container{
    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:white;
    font-size:clamp(28px, 6vw, 48px);
    margin-bottom:40px;

    font-family:"Jost", sans-serif;
    font-weight:700;
    letter-spacing:2px;
}

       .menu{
    display:flex;
    gap:24px;
}

        .card {
            cursor: pointer;
            transition: transform 0.2s;
            display: block;
        }

        .card:hover {
            transform: scale(1.05);
        }
        
.card:active{
    transform:scale(0.96);
}

        .card img{
    width:min(36vw, 220px);
    height:min(36vw, 220px);
    display:block;
}
    </style>
</head>

<body>

<div class="container">

    <h1>RITTER GAMES</h1>

    <div class="menu">

   <a class="card" href="snake/">
    <img src="assets/icon-snake.png" alt="Snake">
</a>

<a class="card" href="tetris/">
    <img src="assets/icon-tetris.png" alt="Tetris">
</a>

    </div>

</div>

</body>
</html>
