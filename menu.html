<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritter Games</title>

    <style>
        body {
            margin: 0;
            background: #24254f;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container{
    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    color:white;
    font-size:48px;
    margin-bottom:50px;
}

        .menu {
            display: flex;
            gap: 60px;
        }

        .card {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 260px;
            height: 260px;
            display: block;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>RITTER GAMES</h1>

    <div class="menu">

    <div class="card" onclick="location.href='snake/'">
        <img src="assets/icon-snake.png" alt="Snake">
    </div>

    <div class="card" onclick="location.href='tetris/'">
        <img src="assets/icon-tetris.png" alt="Tetris">
    </div>

    </div>

</div>

</body>
</html>
