<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritter Games</title>

    <style>
        body {
            margin: 0;
            background: #24254f;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        h1 {
            margin-bottom: 50px;
            font-size: 48px;
        }

        .menu {
            display: flex;
            gap: 40px;
        }

        .card {
            width: 220px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 220px;
            height: 220px;
            border-radius: 20px;
            display: block;
        }

        .label {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
    </style>
</head>

<body>

    <h1>RITTER GAMES</h1>

    <div class="menu">

        <div class="card">
            <img src="assets/icon-snake.png" alt="Snake">
            <div class="label">SNAKE</div>
        </div>

        <div class="card">
            <img src="assets/icon-tetris.png" alt="Tetris">
            <div class="label">TETRIS</div>
        </div>

    </div>

</body>

</html>
