<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritter Games</title>

    <style>
        body {
            margin: 0;
            background: #24254f;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        h1 {
            margin-bottom: 50px;
        }

        .menu {
            display: flex;
            gap: 40px;
        }

        .card {
            width: 180px;
            height: 180px;

            background: white;
            border-radius: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: black;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>RITTER GAMES</h1>

    <div class="menu">
        <div class="card">Snake</div>
        <div class="card">Tetris</div>
    </div>

</body>

</html>
