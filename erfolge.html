<!DOCTYPE html>
<html lang="de">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Erfolge</title>

<style>

body{
    margin:0;
    background:#24254f;
    color:white;
    font-family:"Jost", sans-serif;
}

.container{
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

h1{
    text-align:center;
    margin-bottom:40px;
    font-weight:700;
}

.achievement{
    display:flex;
    align-items:center;

    margin-bottom:25px;
    padding:15px;

    background:rgba(255,255,255,0.05);
    border-radius:20px;
}

.achievement img{
    width:70px;
    height:70px;
    margin-right:20px;
}

.title{
    font-size:24px;
    font-weight:700;
}

.desc{
    font-size:16px;
    opacity:0.8;
}

</style>

</head>

<body>

<div class="container">

<h1>ERFOLGE</h1>

<div class="achievement">
    <img src="assets/erfolg-gelb.png">
   <div class="achievement">

<img
    id="ach-erste-schlange"
    src="assets/erfolg-grau.png">

<div>
    <div class="title">
        Erste Schlange
    </div>

    <div class="desc">
        Erreiche 5 Punkte in Snake
    </div>
</div>

</div>

<div class="achievement">
    <img src="assets/erfolg-grau.png">
    <div>
        <div class="title">Tetris-Profi</div>
        <div class="desc">Erreiche 10.000 Punkte in Tetris</div>
    </div>
</div>

</div>
<script>

const save =
  JSON.parse(localStorage.getItem("ritterGames")) || {};

const achievements =
  save.achievements || {};

if (achievements.erste_schlange) {

  document.getElementById(
    "ach-erste-schlange"
  ).src = "assets/erfolg-gelb.png";

}

</script>
</body>
</html>
